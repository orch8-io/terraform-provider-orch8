name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      # Unit tests plus the lifecycle tests against the in-memory fake engine
      # (they need a terraform binary). Real-engine acceptance tests stay
      # gated behind TF_ACC and are not run here.
      - name: go test
        run: TF_ACC_TERRAFORM_PATH="$(command -v terraform)" go test ./...
      - name: terraform fmt
        run: terraform fmt -check -recursive examples
      - name: docs are up to date (tfplugindocs)
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::docs/ is stale; run 'go generate ./...' and commit the result"
            exit 1
          fi
      - name: goreleaser config check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check
